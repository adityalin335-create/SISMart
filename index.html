  <script>
    window.__sismartPolyfillStatus = {
      current: 'globalThis',
      lastInitialized: 'none',
      lastInvoked: 'none'
    };

    function renderPolyfillStatus() {
      var element = document.getElementById('startup-polyfill-status');
      var status = window.__sismartPolyfillStatus;
      if (element && status) {
        element.textContent = 'Current polyfill: ' + status.current
          + '\nLast initialized: ' + status.lastInitialized
          + '\nLast invoked: ' + status.lastInvoked;
      }
    }

    function completePolyfill(name) {
      window.__sismartPolyfillStatus.lastInitialized = name;
      window.__sismartPolyfillStatus.current = 'none';
      console.info('[StartupPolyfill] initialized:', name);
      renderPolyfillStatus();
    }

    function enterPolyfill(name) {
      window.__sismartPolyfillStatus.lastInvoked = name;
      window.__sismartPolyfillStatus.current = name;
      renderPolyfillStatus();
    }

    function leavePolyfill() {
      window.__sismartPolyfillStatus.current = 'none';
      renderPolyfillStatus();
    }

    if (typeof globalThis === 'undefined') {
      Object.defineProperty(Object.prototype, '__magic__', {
        get: function() {
          return this;
        },
        configurable: true
      });

      __magic__.globalThis = __magic__;
      delete Object.prototype.__magic__;
    }
    completePolyfill('globalThis');

    window.__sismartPolyfillStatus.current = 'queueMicrotask';
    if (typeof queueMicrotask !== 'function') {
      definePolyfill(window, 'queueMicrotask', function(callback) {
        if (typeof callback !== 'function') {
          throw new TypeError('queueMicrotask callback must be a function');
        }

        window.__sismartPolyfillStatus.lastInvoked = 'queueMicrotask';
        setTimeout(function() {
          enterPolyfill('queueMicrotask');
          callback();
          leavePolyfill();
        }, 0);
      });
    }
    completePolyfill('queueMicrotask');

    window.__sismartPolyfillStatus.current = 'Promise.allSettled';
    if (typeof Promise.allSettled !== 'function') {
      definePolyfill(Promise, 'allSettled', function(iterable) {
        enterPolyfill('Promise.allSettled');
        var result = Promise.all(Array.from(iterable, function(value) {
          return Promise.resolve(value).then(
            function(value) {
              return { status: 'fulfilled', value: value };
            },
            function(reason) {
              return { status: 'rejected', reason: reason };
            }
          );
        }));
        leavePolyfill();
        return result;
      });
    }
    completePolyfill('Promise.allSettled');

    function definePolyfill(target, name, implementation) {
      Object.defineProperty(target, name, {
        configurable: true,
        writable: true,
        value: implementation
      });
    }

    window.__sismartPolyfillStatus.current = 'Array.prototype.flat';
    function flattenInto(target, source, depth) {
      for (var index = 0; index < source.length; index += 1) {
        if (!(index in source)) {
          continue;
        }

        var value = source[index];
        if (depth > 0 && Array.isArray(value)) {
          flattenInto(target, value, depth - 1);
        } else {
          target.push(value);
        }
      }
    }

    if (typeof Array.prototype.flat !== 'function') {
      definePolyfill(Array.prototype, 'flat', function(depth) {
        enterPolyfill('Array.prototype.flat');
        var result = [];
        var normalizedDepth = depth === undefined ? 1 : Math.max(Math.floor(Number(depth)) || 0, 0);
        flattenInto(result, Object(this), normalizedDepth);
        leavePolyfill();
        return result;
      });
    }
    completePolyfill('Array.prototype.flat');

    window.__sismartPolyfillStatus.current = 'Array.prototype.flatMap';
    if (typeof Array.prototype.flatMap !== 'function') {
      definePolyfill(Array.prototype, 'flatMap', function(callback, thisArg) {
        enterPolyfill('Array.prototype.flatMap');
        if (typeof callback !== 'function') {
          throw new TypeError('flatMap callback must be a function');
        }

        var result = [];
        var source = Object(this);
        for (var index = 0; index < source.length; index += 1) {
          if (index in source) {
            flattenInto(result, [callback.call(thisArg, source[index], index, source)], 1);
          }
        }
        leavePolyfill();
        return result;
      });
    }
    completePolyfill('Array.prototype.flatMap');

    window.__sismartPolyfillStatus.current = 'Object.fromEntries';
    if (typeof Object.fromEntries !== 'function') {
      definePolyfill(Object, 'fromEntries', function(iterable) {
        enterPolyfill('Object.fromEntries');
        var result = {};
        var iterator = iterable[Symbol.iterator]();
        var step;

        while (!(step = iterator.next()).done) {
          var entry = step.value;
          if (Object(entry) !== entry) {
            throw new TypeError('Iterator value is not an entry object');
          }
          Object.defineProperty(result, entry[0], {
            configurable: true,
            enumerable: true,
            writable: true,
            value: entry[1]
          });
        }

        leavePolyfill();
        return result;
      });

  <div id="startup-fallback" style="position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 2147483647; display: grid; place-items: center; padding: 24px; background: #fff; color: #111; font: 600 20px/1.4 sans-serif;">
    STARTING SISMART
    <div id="startup-polyfill-status" style="margin-top: 12px; font: 12px/1.4 monospace;"></div>
  </div>
  <div id="root"></div>
  <script>
    function formatStartupError(error) {
      if (error instanceof Error) {
        return [error.name + ': ' + error.message, error.stack].filter(Boolean).join('\n\n');
      }

      if (typeof error === 'string') {
        return error;
      }

      try {
        return JSON.stringify(error, null, 2);
      } catch {
        return String(error);
      }
    }

    window.__sismartShowStartupError = function (error) {
      var output = document.getElementById('startup-error');
      if (!output) {
        output = document.createElement('pre');
        output.id = 'startup-error';
        output.style.cssText = 'position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 2147483647; overflow: auto; margin: 0; padding: 20px; box-sizing: border-box; white-space: pre-wrap; word-break: break-word; background: #fff; color: #900; font: 14px/1.5 monospace;';
        document.body.appendChild(output);
      }
      var polyfillStatus = window.__sismartPolyfillStatus;
      var statusText = polyfillStatus
        ? '\n\nLast initialized polyfill: ' + polyfillStatus.lastInitialized
          + '\nLast invoked polyfill: ' + polyfillStatus.lastInvoked
          + '\nPolyfill active at error: ' + polyfillStatus.current
        : '';
      output.textContent = 'SISMART STARTUP ERROR' + statusText + '\n\n' + formatStartupError(error);
    };

    var polyfillStatusElement = document.getElementById('startup-polyfill-status');
    if (polyfillStatusElement) renderPolyfillStatus();

    window.addEventListener('error', function (event) {
      var target = event.target;
      var details = event.error || event.message;

      if (target instanceof HTMLScriptElement) {
        details = [details, 'Script: ' + target.src].filter(Boolean).join('\n');
      }
      if (event.filename) {
        details = String(details || 'Unknown JavaScript error')
          + '\n\n' + event.filename + ':' + event.lineno + ':' + event.colno;
      }

      window.__sismartShowStartupError(details || 'Unknown JavaScript error');
    }, true);

    window.addEventListener('unhandledrejection', function (event) {
      window.__sismartShowStartupError(event.reason);
    });
  </script>
