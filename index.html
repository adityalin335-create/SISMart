  <script>
    const scriptStatus = document.createElement('p');
    scriptStatus.textContent = 'Script tag reached.';
    scriptStatus.style.cssText = 'position: fixed; top: 72px; left: 8px; z-index: 2147483647; margin: 0; padding: 8px; background: #e8f0ff; color: #111; font: 14px/1.4 sans-serif;';
    document.body.append(scriptStatus);
  </script>
  <div id="root"></div>
  <script>
    document.body.insertAdjacentHTML(
      'beforeend',
      '<div id="before-bundle">Before Bundle</div>'
    );

    function showBundleError(message) {
      const errorOutput = document.createElement('div');
      errorOutput.style.cssText = 'position: fixed; top: 110px; left: 8px; z-index: 2147483647; max-width: calc(100vw - 32px); padding: 8px; background: #fee; color: #900; font: 14px/1.4 sans-serif;';
      errorOutput.textContent = message;
      document.body.append(errorOutput);
    }

    window.addEventListener('error', (event) => {
      showBundleError(`JavaScript error: ${event.message || 'Unknown error'} (${event.filename || 'unknown file'}:${event.lineno || 0}:${event.colno || 0})`);
    });

    window.addEventListener('unhandledrejection', (event) => {
      const reason = event.reason;
      showBundleError(`Unhandled promise rejection: ${reason instanceof Error ? `${reason.name}: ${reason.message}` : String(reason)}`);
    });
  </script>
  <script type="module">
    import("/src/main.tsx")
      .then(() => {
        document.body.insertAdjacentHTML(
          "beforeend",
          "<div style='color:green'>MODULE LOADED</div>"
        );
      })
      .catch((err) => {
        document.body.insertAdjacentHTML(
          "beforeend",
          "<pre style='color:red'>" +
            String(err && err.stack || err) +
            "</pre>"
        );
      });
  </script>
  <script>
    document.body.insertAdjacentHTML(

  </script>
